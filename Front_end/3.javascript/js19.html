<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <script>
        /**
         * [AJAX 학습 포인트]
         * 1. AJAX(비동기 통신)란? 페이지 새로고침 없이 서버(또는 파일)로부터 데이터를 몰래 가져오는 기술입니다.
         * 2. XMLHttpRequest: 브라우저가 제공하는 내장 통신 객체입니다.
         * 3. GET 방식의 데이터 전달: 주소창에 ?key=value 형태로 데이터를 붙여서 목적지(data.json)로 전송합니다.
         * 4. JSON 파싱: 서버로부터 받아온 데이터는 단순한 '글자(문자열)'이므로, 자바스크립트가 다룰 수 있는 객체/배열로 변환해야 합니다.
         */
        function ajaxGet() {
            // [1] 통신을 담당할 우체부(XMLHttpRequest 객체)를 생성합니다.
            const xhr = new XMLHttpRequest();

            // [2] 서버로 보낼 파라미터(데이터)를 정의합니다. (Key=Value 형태)
            // 실제 서버 프로그램이 있다면 이 값을 받아서 알맞은 데이터를 필터링해 줍니다.
            let params = "num=1&id=hk";

            // [3] 요청을 보낼 준비(설정)를 합니다.
            // - 첫 번째 인자: 전송 방식 ("GET")
            // - 두 번째 인자: 요청할 주소 (주소?파라미터 형태인 `js/data.json?num=1&id=hk`로 조립됨)
            // - 세 번째 인자: 비동기(Async) 통신 여부 (true = 비동기 방식으로 진행)
            xhr.open("GET", `js/data.json?${params}`, true);

            // [4] 통신 상태가 바뀔 때마다 실행될 감시자(이벤트 리스너)를 등록합니다.
            // (통신 시작 -> 응답 헤더 받음 -> 다운로드 중 -> 완료 등 단계마다 계속 호출됨)
            xhr.onreadystatechange = function () {
                // - xhr.readyState === 4: 데이터를 전부 다 다운로드 받았는지 확인 (4 = 완료)
                // - xhr.status === 200: 서버 접속 및 요청 결과가 성공인지 확인 (200 = 성공)
                if (xhr.readyState === 4 && xhr.status == 200) {

                    // [5] 서버가 보낸 순수 문자열 데이터를 자바스크립트 객체/배열로 변환합니다.
                    // data.json 파일 내용이 대괄호 `[ ... ]`로 묶인 배열 형태이므로, 변수 data는 배열이 됩니다.
                    let data = JSON.parse(xhr.responseText);

                    // [6] 받아온 데이터를 콘솔에 출력해봅니다. 
                    // data는 배열이므로 첫 번째 항목에 접근하기 위해 인덱스 [0]을 사용합니다.
                    console.log(data[0].id, data[0].name);

                    // [7] 화면(HTML)의 특정 영역(#result)에 받아온 회원 정보를 출력합니다.
                    document.querySelector("#result").innerHTML =
                        `<p>아이디: ${data[0].id}</p>
                         <p>이름: ${data[0].name}</p>
                         <p>주소: ${data[0].addr}</p>`;
                }
            }

            // [8] 준비 완료된 요청을 실제로 서버에 전송합니다.
            xhr.send();
        }

        /*
            콜백 지옥 발생 상황
            글목록을 조회 -> 글상세내용을 조회 ->글 수정 이런식의 연속적인 요청 처리가 필요한 상황에서
            getBoardList(,function(){
                getBoard(function(){
                    updateBoard(function(){
                        deleteBoard(function(){

                        })
                    })
                })
            })

            */
        //Promise 객체가 해결
        //비동기 작업의 성공/실패에 대한 객체를 반환해서 then()으로 받아서 처리
        //콜백지옥의 들여쓰기를 제거할 수 있게 된다.
        //getBoardList().then((res)=>{res return res;}).then((res2)=>})
        // [Promise 기반의 AJAX 함수 정의]
        // - 이 함수는 호출되면 즉시 "비동기 작업을 수행하겠다는 약속(Promise 객체)"을 반환합니다.
        function promiseTest(method, url = "", data = null) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                // 세 번째 인자 true를 통해 '비동기' 방식으로 통신을 준비합니다.
                xhr.open(method, url, true);

                // 통신 상태 변화를 감시하는 이벤트 핸들러
                xhr.onreadystatechange = function () {
                    // readyState가 4(완료)일 때만 처리합니다.
                    if (xhr.readyState === 4) {
                        if (xhr.status == 200) {
                            // 1. 성공 시 resolve()를 호출하여 결과 데이터(문자열)를 약속의 결과로 전달합니다.
                            resolve(xhr.responseText);
                        } else {
                            // 2. 실패 시 reject()를 호출하여 실패 이유를 전달합니다.
                            reject("통신실패");
                        }
                    }
                }

                // 요청 전송
                xhr.send();
            })
        }

        // [Promise를 직접 사용하는 예제]
        // - 직접 정의한 promiseTest() 함수를 사용해 비동기 데이터를 가져오고 체이닝을 학습합니다.
        function ajaxPromise() {
            // promiseTest 함수는 Promise 객체를 반환하므로 뒤에 .then()과 .catch()를 붙일 수 있습니다.
            // 💡 기존 코드의 대소문자 오류 수정: PromiseTest -> promiseTest
            promiseTest("GET", "js/data.json")
                .then((response) => {
                    // [첫 번째 .then]: 성공(resolve) 시 실행됩니다. response에는 xhr.responseText가 들어있습니다.
                    const data = JSON.parse(response); // JSON 문자열을 JS 객체로 파싱합니다.

                    // 화면에 렌더링
                    document.querySelector("#result").innerHTML =
                        `<p>아이디: ${data[0].id}</p>
                         <p>이름: ${data[0].name}</p>
                         <p>주소: ${data[0].addr}</p>`;

                    // 다음 .then 블록으로 데이터를 넘겨주기 위해 return을 합니다.
                    return data;
                })
                .then((res) => {
                    // [두 번째 .then]: 이전 .then에서 리턴한 data(res)를 받아와 실행합니다. (Promise 체이닝)
                    console.log("체이닝된 데이터 출력:", res);
                })
                .catch((error) => {
                    // [실패 시 .catch]: reject()가 호출되었거나, .then 내부에서 에러가 발생하면 이곳으로 넘어옵니다.
                    console.error("Promise 통신 중 실패:", error);
                });
        }

        // [최신 JavaScript의 fetch API를 사용하는 예제]
        // - fetch()는 브라우저가 기본 제공하는 Promise 기반의 비동기 통신 함수입니다.
        // - 직접 XMLHttpRequest와 Promise를 조립할 필요 없이 한 줄로 깔끔하게 시작할 수 있습니다.
        function ajaxFetch() {
            // 💡 경로 수정: data.json -> js/data.json
            fetch("js/data.json")
                .then((response) => {
                    // [첫 번째 .then]: fetch는 응답을 통째로 감싼 Response 객체를 반환합니다.
                    // 본문 데이터를 JSON 형태로 바꾸기 위해 response.json()을 사용해야 합니다.
                    // response.json() 역시 Promise를 반환하므로 다음 .then에서 파싱된 결과를 받게 됩니다.
                    return response.json();
                })
                .then((data) => {
                    // [두 번째 .then]: 파싱이 완료된 JS 객체 데이터(배열)를 받아 화면에 출력합니다.
                    document.querySelector("#result").innerHTML =
                        `<p>아이디: ${data[0].id}</p>
                         <p>이름: ${data[0].name}</p>
                         <p>주소: ${data[0].addr}</p>`;
                })
                .catch((error) => {
                    // 통신 장애 등 실패 시 실행
                    console.error("Fetch 통신 중 실패:", error);
                });
        }

    </script>
</head>

<body>
    <button onclick="ajaxGet()">Get방식 (기본 AJAX)</button>
    <button onclick="ajaxPromise()">Promise 방식</button>
    <button onclick="ajaxFetch()">Fetch API 방식</button>
    <div id="result"></div>
</body>

</html>
