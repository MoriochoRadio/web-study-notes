<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>

    <script>
        function idChk() {
            const a = document.getElementById("a");
            const b = document.getElementById("b");
            const c = document.getElementById("c");

            a.style.backgroundColor = "red";
            b.style.backgroundColor = "green";
            c.style.backgroundColor = "blue";

        }

        function nameChk() {
            const inputs = document.getElementsByName("nameval01");
            const id = inputs[0].value;
            const pwd = inputs[1].value;
            alert("id:" + id + "/pwd:" + pwd);
        }

        function tagNameChk() {
            const tags = document.getElementsByTagName("div");
            const tag2 = tags[1];
            tag2.style.backgroundColor = "yellow";
        }
    </script>
</head>

<body>
    <h2>1.엘리먼트를 id속성을 사용하여 탐색하고 각각의 엘리먼트에 대해 배경색을 적용하세요.
        <input type="button" value="클릭!" onclick="idChk()">
    </h2>
    <p id="a">id탐색하기01</p>
    <p id="b">id탐색하기02</p>
    <p id="c">id탐색하기03</p>
    <hr>
    <h2>2.엘리먼트를 name속성을 사용하여 탐색하고 화면에서 입력한 값을 alert()대화창으로
        출력하세요.
        <br /><small>출력 내용 - id:<span>**</span>/pwd:<span>**</span> </small>
    </h2>
    <label>id:</label><input type="text" name="nameval01" value=""><br>
    <label>패스워드:</label><input type="text" name="nameval01"><br>
    <input type="button" value="입력" onclick="nameChk()">
    <hr>
    <h2>3.엘리먼트를 tagname으로 탐색하고 div태그중 두번째 요소만 배경색을 yellow로 적용하세요.</h2>
    <div>태그이름으로 탐색</div>
    <div>리턴은 배열이다.</div>
    <div>인덱스로 값(엘리먼트)을 가져와야한다.</div>
    <input type="button" value="클릭!" onclick="tagNameChk()">
</body>

</html>
