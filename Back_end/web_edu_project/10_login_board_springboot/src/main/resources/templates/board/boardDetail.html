<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layouts/layout}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script type="text/javascript">
	function updateEX(){
		if(confirm("수정하시겠습니까?")){
			return true;
		}
		return false
	}
</script>
<style type="text/css">

</style>
</head>
<body>
<div layout:fragment="content">
<div id="container">
<h1>상세보기</h1>
<!-- 파일을 같이 보내려면 enctype="multipart/form-data" 가 반드시 필요 -->
<form action="/board/boardUpdate" method="post" onsubmit="return updateEX()"
								enctype="multipart/form-data"
								th:object="${updateBoardCommand}">
	<input type="hidden" name="board_seq"  th:value="${dto.board_seq}"/>
	<!-- isWriter: 본인 글인지 / hasFiles: 실제 첨부파일이 있는지 — 아래에서 여러 번 쓰므로 한 번만 계산 -->
	<table class="table"
		   th:with="isWriter=${session.mdto != null and session.mdto.id == dto.id},
		            hasFiles=${dto.fileBoardDto != null and !#lists.isEmpty(dto.fileBoardDto)
		                       and dto.fileBoardDto[0].origin_filename != null}">
		<tr>
			<th>작성자[ID]</th>
			<td th:text="${dto.id}"></td>
		</tr>
		<tr>
			<th>제목</th>
			<td>
				<input type="text" name="title" th:value="${dto.title}"
												class="form-control"/>
				<span th:if="${#fields.hasErrors('title')}" 
					  th:errors="*{title}" class="errorField"></span>
			</td>
		</tr>
		<tr>
			<th>파일 [[${hasFiles ? #lists.size(dto.fileBoardDto) : 0}]]</th>
			<td>
				<!-- 기존 첨부파일: 누구나 다운로드 / 작성자에게만 '삭제' 체크박스 -->
				<span th:unless="${hasFiles}">첨부파일없음</span>
				<th:block th:if="${hasFiles}" th:each="fdto:${dto.fileBoardDto}">
					<div>
						<span class="glyphicon glyphicon-folder-open"></span>
						<a th:text="${fdto.origin_filename}"
						   th:href="@{/board/download(file_seq=${fdto.file_seq})}" ></a>
						<label th:if="${isWriter}">
							&nbsp;<input type="checkbox" name="delFileSeq" th:value="${fdto.file_seq}"/> 삭제
						</label>
<!-- 					<img th:src="@{'/upload/'+${fdto.stored_filename}}"/> -->
					</div>
				</th:block>
				<!-- 새 첨부파일 추가 (작성자에게만). 교체 = 기존 파일 '삭제' 체크 + 새 파일 선택 -->
				<div th:if="${isWriter}" style="margin-top: 8px;">
					<input type="file" name="filename" multiple="multiple" class="form-control"/>
					<small>새 파일을 고르면 추가됩니다. 바꾸려면 기존 파일의 '삭제'를 체크하고 새 파일을 고르세요.</small>
				</div>
			</td>
		</tr>
		<tr>
			<th>내용</th>
			<td>
				<textarea rows="10" cols="60" name="content"
						  th:text="${dto.content}"
				          class="form-control"></textarea>
				<span th:if="${#fields.hasErrors('content')}" 
					  th:errors="*{content}" class="errorField"></span>
			</td>
		</tr>
		<tr>
			<td colspan="2">
				<!-- 본인 글일 때만 수정·삭제 버튼 표시 (편의용. 진짜 막는 건 Controller 의 isWriter 검사) -->
				<th:block th:if="${isWriter}">
					<button type="submit" class="btn">수정</button>
					<button type="button" class="btn"
					 th:onclick="|location.href='@{/board/mulDel(seq=${dto.board_seq})}'|">삭제</button>
				</th:block>
				<button type="button" class="btn"
				 th:onclick="|location.href='@{/board/boardList}'|">목록</button>
			</td>
		</tr>
	</table>
</form>
</div>
</div>
</body>
</html>
