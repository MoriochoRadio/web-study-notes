spring.application.name=login_board_springboot10

# server port 설정하기
server.port=9090

#cache 활성화 여부, 개발환경시에는 비 활성화
spring.thymeleaf.cache=false

#template 인코딩
spring.thymeleaf.encoding=UTF-8
#기본 template모드 html,xml,text, js 등
spring.thymeleaf.mode=HTML

#DB 설정
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/hk
spring.datasource.username=study
spring.datasource.password=YOUR_DB_PASSWORD

#mybatis 설정
mybatis.type-aliases-package=com.hk.board.dtos
mybatis.mapper-locations=classpath:/mybatis/**/*.xml

#파일 한개당 사이즈
spring.servlet.multipart.max-file-size = 100MB
#요청당 최대 파일 사이즈
spring.servlet.multipart.max-request-size = 100MB

# encoding
# server.servlet.encoding.charset=UTF-8
# server.servlet.encoding.force=true
# server.servlet.encoding.enabled=true

# 로그 설정 (System.out.println → @Slf4j 로 바꾼 뒤)
# com.hk.board 패키지는 debug 부터 출력 (개발할 때 세부 내용까지 보기)
logging.level.com.hk.board=debug
# 콘솔과 함께 파일에도 남김 → 실행 폴더 기준 logs/app.log (서버를 꺼도 기록이 남음)
logging.file.name=logs/app.log

# 첨부파일 저장 폴더 — 업로드(BoardService)·다운로드(FileService)·/upload/** 보여주기(WebMvcConfig)가 모두 이 값을 쓴다
# ${user.dir} 은 실행 폴더(= 예전 코드의 System.getProperty("user.dir")) → 동작은 그대로, 위치만 한 곳으로 모음
file.upload-dir=${user.dir}/upload
