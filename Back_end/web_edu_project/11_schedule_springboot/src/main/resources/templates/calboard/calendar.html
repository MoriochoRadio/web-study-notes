<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- ===== 달력 화면 (GET /schedule/calendar) =====
         Controller 가 넘긴 calMap 하나로 그린다:
           calMap.year, calMap.month   : 보여 줄 연·월
           calMap.dayOfWeek            : 1일의 요일 (1=일 ~ 7=토) → 앞쪽 빈칸 수
           calMap.lastDay              : 말일 (28~31) → 날짜 칸 수
           calMap.clist                : 이번 달 일정 (날짜마다 최대 3개)
         layout:decorate = layouts/layout.html 틀(머리·꼬리)을 입고, 아래 content 조각만 채운다 -->
        <div id="container">
            <h1>일정관리[달력]</h1>
            <div class="cal">
                <!-- 위쪽 이동 버튼: ◁ 작년 · ◀ 지난달 · ▶ 다음달 · ▷ 내년
                     @{주소(이름=값,...)} 는 ?year=..&month=.. 를 붙인 주소를 만든다.
                     month-1 이 0, month+1 이 13 이 되는 경우는 Service 가 연도를 넘겨 맞춘다 -->
                <div id="ctitle">
                    <a th:href= "@{/schedule/calendar(year=${calMap.year-1},month=${calMap.month})}">◁</a>
                    <a th:href= "@{/schedule/calendar(year=${calMap.year},month=${calMap.month-1})}">◀</a>
                    <span class="y" th:text="${calMap.year}"></span>
                    <span>년</span>
                    <span class="m" th:text="${calMap.month}"></span>
                    <span>월</span>
                    <a th:href= "@{/schedule/calendar(year=${calMap.year},month=${calMap.month+1})}">▶</a>
                    <a th:href= "@{/schedule/calendar(year=${calMap.year+1},month=${calMap.month})}">▷</a>
                </div>
                <!-- 요일 머리줄 (CSS 가 div 7개를 옆으로 나란히 놓는다) -->
                <div id="thead">
                    <div>일</div><div>월</div><div>화</div><div>수</div>
                    <div>목</div><div>금</div><div>토</div>
                </div>
                <div id="tbody">
                    <!-- ① 1일 앞의 빈칸: 1일이 수요일(4)이면 1~3 → 빈 div 3개.
                         1일이 일요일(1)이면 빈칸이 없어야 해서 th:if 로 막는다 -->
                    <th:block th:if= "${calMap.dayOfWeek>1}">
                        <div th:each= "num:${#numbers.sequence(1,calMap.dayOfWeek-1)}">&nbsp;</div>
                    </th:block>
                    <!-- ② 날짜 칸: i 가 1부터 말일까지. 칸 하나 = 날짜 숫자 + 연필 + 그날 일정 -->
                    <th:block th:each= "i:${#numbers.sequence(1,calMap.lastDay)}">
                        <div>
                            <a th:href="@{/schedule/calboardlist(year=${calMap.year},month=${calMap.month},date=${i})}" th:text="${i}" class="d"></a>
                            <a th:href="@{/schedule/addcalboardform(year=${calMap.year},month=${calMap.month},date=${i})}">
                                <img class="pen" th:src="@{/img/pen.png}" alt="일정추가"/>
                            </a>
                            <!-- 일정 목록이 출력되는 부분-->
                             <!-- i값하고 clist의 날짜와 비교해서 일정 출력 -->
                            <!-- @util = Util 빈. getCalViewList 가 그날 일정을 p 태그 문자열로 돌려주고,
                                 아래 출력 문법(대괄호 + 소괄호)은 태그를 글자로 바꾸지 않고 그대로 그린다
                                 (th:text 였다면 p 태그가 글자로 보였을 것) -->
                            <th:block th:with="calList=${@util.getCalViewList(i, calMap.clist)}">
                                [(${calList})]
                            </th:block>
                        </div>
                    </th:block>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
