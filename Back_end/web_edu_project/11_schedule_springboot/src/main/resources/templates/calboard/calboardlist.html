<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일정목록(calboardlist.html)</title>
</head>
<body>
    <!-- 목록 내용: checkbox, mdate, title, regdate -->
    <div layout:fragment="content">
        <div id="container">
            <h1>일정 목록</h1>
            <p>
                <b th:text="${year} + '년 ' + ${month} + '월 ' + ${date} + '일'"></b>
                (<span th:text="${id}"></span>님의 일정 <span th:text="${#lists.size(list)}"></span>개)
            </p>

            <table class="table">
                <tr>
                    <th><input type="checkbox" id="allChk" onclick="allSel(this.checked)"/></th>
                    <th>일정 시간</th>
                    <th>제목</th>
                    <th>작성일</th>
                </tr>
                <!-- 일정이 없을 때 -->
                <tr th:if="${#lists.isEmpty(list)}">
                    <td colspan="4">등록된 일정이 없습니다.</td>
                </tr>
                <!-- 일정이 있을 때: list 안의 CalDto를 하나씩 dto로 꺼내 한 줄씩 -->
                <tr th:each="dto:${list}">
                    <!-- 체크박스 값 = seq (나중에 여러 개 삭제할 때 calMulDel 에 넘길 번호) -->
                    <td><input type="checkbox" name="seq" th:value="${dto.seq}"/></td>
                    <!-- mdate "202610140905" → "2026-10-14 09:05" 로 잘라서 보여 주기 -->
                    <td th:text="${#strings.substring(dto.mdate,0,4)} + '-' + ${#strings.substring(dto.mdate,4,6)} + '-'
                                + ${#strings.substring(dto.mdate,6,8)} + ' ' + ${#strings.substring(dto.mdate,8,10)}
                                + ':' + ${#strings.substring(dto.mdate,10,12)}"></td>
                    <td th:text="${dto.title}"></td>
                    <!-- regdate 는 Date 객체 → #dates.format 으로 원하는 모양으로 -->
                    <td th:text="${#dates.format(dto.regdate,'yyyy-MM-dd')}"></td>
                </tr>
            </table>

            <a th:href="@{/schedule/addcalboardform(year=${year},month=${month},date=${date})}">일정 추가</a> |
            <a th:href="@{/schedule/calendar(year=${year},month=${month})}">달력으로 돌아가기</a>
        </div>

        <script>
            // 전체 선택 체크박스: 위의 체크박스 상태를 name="seq" 체크박스 전부에 똑같이 적용
            function allSel(checked) {
                document.querySelectorAll("input[name=seq]").forEach(function (chk) {
                    chk.checked = checked;
                });
            }
        </script>
    </div>
</body>
</html>
