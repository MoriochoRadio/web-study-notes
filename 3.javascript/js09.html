        //사전식 정렬
        function sortTest01() {
            const arrayTest = ["a", "b", "e", "d", "c"];
            arrayTest.sort();//사전식 정렬(기본기능). 즉 사전식이 기본 정렬임
            console.log(arrayTest.toString());
            arrayTest.reverse();//역순정렬
            console.log(arrayTest.toString());
        }
        //크기순 정렬
        function sortTest02() {
            let arrayTest = [1, 3, 2, 10, 7, 6, 4, 5, 9, 8]
            //arrayTest.sort(); //숫자라도 기본적으로 사전식으로 정렬함(10이 2보다 앞으로 옴)
            //arrayTest.sort(compareNum); //compareNum() 함수를 사용해서 숫자를 비교한다
            //arrayTest.sort(function (a, b) { return a - b; }) //익명함수를 사용
            arrayTest.sort((a, b) => a - b); // 화살표 함수를 사용
            console.log(arrayTest.toString());
        } //기본이 사전식정렬이라 크기순으로 비교할 수 있는 기능을 제공해야함

        //숫자 a와 b를 받아서 a-b > 0, a-b < 0 식으로 구별하게 만듬
        function compareNum(a, b) {

            // return b-a; //내림차순
        }

        //push():배열의 마지막에 요소추가
        //shift():배열의 첫번째 요소를 추출하고 제거
        //pop():배열의 마지막 요소를 추출하고 제거
        function pushAndShift() {
            const queue = [];
            queue.push("first");
            queue.push("second");
            queue.push("third");

            let val = queue.shift();

        //문자열에 ssubString()과 유사하다
        //인덱스 범위로 값을 추출해서 새로운 배열로 반환
        //배열에 값이 객체인 경우에는 원본배열이 변경될 수 있다.

        function sliceTest() {
            const arrayLit = [1, 2, 3, 4, 5]; //값이 기본타입
            const arrayObj = [[1, 2], [3, 4], [5, 6]]; //배열에 값이 객체임

            const arrayObj02 = arrayObj.slice(1, 3); //[[3,4],[5,6]]
            arrayObj02[0][0] = 10;//복사 받은 쪽에서 값을 변경 [[10,4],[5,6]]
            console.log(`복사받은쪽:${arrayObj02.toString()}`);
            console.log(`원본쪽:${arrayObj.toString()}`);

            //얕은복사, 깊은복사
            const aa = [1, 2, 3, 4, 5];
            //얕은복사
            const cc = aa; //주소값만 복사 (실제값이 아니라 메모리 위치만 복사) // 이걸 바꾸면 원본도 바뀜
            cc[0] = 10;
            console.log("원본:", aa.toString())

            //깊은 복사
            const bb = [1, 2, 3, 4, 5];
            const dd = [bb[0], bb[1], bb[2], bb[3], bb[4]];
            dd[0] = 10;
            console.log("깊은 복사 원본:", bb.toString()); // [1,2,3,4,5] // [10,2,3,4,5]
            console.log("깊은 복사:", dd.toString());

            //스프레드 연산자를 사용한 깊은 복사(배열의 값이 기본타입일 경우)
            const ee = [1, 2, 3, 4, 5];
            const ff = [...ee];
            ff[0] = 10;
            console.log("깊은 복사 원본:", ee.toString());
            console.log("깊은 복사:", ff.toString());

            spreadTest(1, 2, 3, 4, 5, 6);
        }

        // (pa1,pa2,pa3) --> func(1,2,3) 4개, 6개 가변적으로 하려면 스프레드 연산자로 하면 함수에서 받아진다
        function spreadTest(...val) {
            for (i = 0; i < val.length; i++) {
                console.log(val[i]);
            }
            console.log("----------------")
        }
