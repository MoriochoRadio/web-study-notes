<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>인적사항 입력 표</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style type="text/css">
        table {
            border-collapse: collapse;
            width: 700px;
            ;
        }

        .asd {
            width: 120px
        }
    </style>
</head>

<body>

    <table border="1">
        <tbody>
            <tr>
                <td rowspan="6" class="asd"></td>
                <td>성명</td>
                <td colspan="3">(한문)</td>
            </tr>

            <tr>
                <td>주민번호</td>
                <td></td>
                <td>생년월일</td>
                <td>년 월 일(음력/양력)</td>
            </tr>

            <tr>
                <td>주소</td>
                <td colspan="3"></td>
            </tr>

            <tr>
                <td>전화번호</td>
                <td></td>
                <td>E-MAIL</td>
                <td></td>
            </tr>

            <tr>
                <td>핸드폰</td>
                <td></td>
                <td>결혼유무</td>
                <td>미혼 / 기혼</td>
            </tr>

            <tr>
                <td>가족사항</td>
                <td>남 녀 중</td>
                <td>주거사항</td>
                <td>동거 / 비 동거</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
