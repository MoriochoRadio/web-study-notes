<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>웹 개발 학습 노트 — 이동 중…</title>
  <!-- 저장소가 Front_end / Back_end 구조로 재편되면서 대시보드가 Front_end/로 이동함.
       기존 북마크·공유 링크(카드 앵커 #id 포함)가 깨지지 않도록 해시를 보존해 리다이렉트. -->
  <script>
    location.replace("Front_end/" + location.search + location.hash);
  </script>
  <meta http-equiv="refresh" content="0; url=Front_end/" />
</head>
<body>
  <p><a href="Front_end/">웹 개발 학습 노트로 이동하기</a></p>
</body>
</html>
