name: Verify study notes

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "**.md"
      - "scripts/**"
      - ".github/workflows/verify-study-notes.yml"
  pull_request:
    paths:
      - "**.html"
      - "**.md"
      - "scripts/**"
      - ".github/workflows/verify-study-notes.yml"
  workflow_dispatch:

# 이 워크플로는 파일 검사만 수행한다. 저장소·배포·이슈에 쓰기 권한을 부여하지 않는다.
permissions:
  contents: read

concurrency:
  group: study-notes-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-static-study-notes:
    name: Verify static study notes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check repository-local links and assets
        run: python3 scripts/check_internal_links.py

      - name: Check frontend dashboard inventory
        run: python3 scripts/verify_frontend_inventory.py
